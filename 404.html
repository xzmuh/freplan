<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freplan</title>
    <script>
      (function () {
        var base = "/freplan/";
        var path = window.location.pathname;
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : "";
        var target = base + "#/" + route + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
